name: disk-cleanup
version: 2.1.0
description: "Auto-track and clean up ephemeral files (test scripts, temp outputs, cron logs) created during Hermes sessions. Runs via plugin hooks — no agent action required."
author: "@LVT382009 (original), NousResearch (plugin port)"
hooks:
  - post_tool_call
  - on_session_end
config_schema:
  exempt_paths:
    type: array
    default: []
    description: "Absolute literal paths excluded from cleanup, including canonical descendants and recursive ancestors. Invalid policy blocks deletion."
  exempt_path_contains:
    type: array
    items:
      type: string
      minLength: 1
    default: []
    description: "Case-sensitive literal substrings matched against full normalized absolute lexical and resolved paths. Recursive removal also scans descendant file and directory paths without following symlink subtrees. Invalid types, empty/nonstring/NUL entries, or scan/stat errors block cleanup."
