name: Scoped Linux migration acceptance
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact source commit to qualify
        required: true
        type: string
permissions:
  contents: read
jobs:
  linux-legacy-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact source under test
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
      - name: Set up locked test environment
        uses: ./.github/actions/setup-pm
        with:
          packages: 'ripgrep'
          extras: '["all"]'
          test-environment: 'true'
          prune-python-cache: true
      - name: Require the existing PID-namespace sandbox
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python -c "from tests.e2e.core.upgrade._helpers import BWRAP_OK; assert BWRAP_OK"
      - name: Replay only the original legacy-feature migration
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          scripts/run_tests.sh tests/e2e/core/upgrade/pm/test_configured_features.py -j 1 --file-retries 0 --file-timeout 3000 -- -k legacy_venv_features_carry -o tmp_path_retention_policy=failed -v --tb=short
        env:
          HERMES_E2E_UPGRADE_BASE: 86fed153b9ceb586fbcc438a29b7c152241601b4
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''
      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree
