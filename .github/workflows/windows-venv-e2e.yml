name: Windows unit capacity control (diagnostic only)

# Temporary wine2e branch control; never merge this selector into release CI.
on:
  push:
    branches: ['wine2e/unit-capacity-217']

permissions:
  contents: read

jobs:
  windows-unit-capacity:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout exact diagnostic head
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a
      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          packages: 'git,ripgrep'
          extras: '["all", "telegram", "anthropic", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
          prune-python-cache: true
      - name: Run observed slow Windows files at two workers
        shell: bash
        run: |
          set -euo pipefail
          scripts/run_tests.sh \
            tests/scripts/desktop_update/test_desktop_update_windows_commit_outcome.py \
            tests/scripts/desktop_update/test_desktop_update_windows_handoff_lineage.py \
            tests/scripts/desktop_update/test_desktop_update_windows_marker_lock.py \
            tests/scripts/desktop_update/test_desktop_update_windows_marker_ops.py \
            -j 2 --file-retries 0 -- -m "platforms and not integration" -v --tb=short
        env:
          HERMES_TEST_FILE_TIMEOUT: '600'
          OPENROUTER_API_KEY: ''
          OPENAI_API_KEY: ''
          NOUS_API_KEY: ''
      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree
